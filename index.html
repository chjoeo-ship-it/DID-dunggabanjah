<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digilib ITB Downloader</title>
</head>

<body>

    <h1>Digilib ITB Downloader</h1>

    <label for="documentId">ID / Token</label>
    <br>

    <input
        type="text"
        id="documentId"
        placeholder="Contoh: 341829"
    >

    <br><br>

    <label for="filename">Nama File</label>
    <br>

    <input
        type="text"
        id="filename"
        placeholder="Contoh: 2024 DIS PP SARIPUDIN 1-ABSTRAK"
    >

    <br><br>

    <button onclick="downloadPDF()">
        Download PDF
    </button>

    <p id="status">Status: Menunggu...</p>


    <script>

        async function downloadPDF() {

            const documentId =
                document.getElementById('documentId').value.trim();

            const filename =
                document.getElementById('filename').value.trim();

            const status =
                document.getElementById('status');


            // Cek input
            if (!documentId) {

                status.textContent =
                    'ID / Token harus diisi.';

                return;
            }


            if (!filename) {

                status.textContent =
                    'Nama file harus diisi.';

                return;
            }


            try {

                status.textContent =
                    'Menghubungi Digilib ITB...';


                // Request ke Digilib ITB
                const response = await fetch(
                    `https://digilib.itb.ac.id/gdl/generate_token/${documentId}`
                );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                console.log(
                    'Response Digilib:',
                    data
                );


                status.textContent =
                    'Berhasil mendapatkan URL.';


            } catch (error) {

                console.error(error);


                status.textContent =
                    'Gagal: ' + error.message;

            }

        }

    </script>

</body>
</html>
